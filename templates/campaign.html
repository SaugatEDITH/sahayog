{% extends "base.html" %}
{% block stylesheet %}
<link rel="stylesheet" href="/static/css/campaign.css">
{% endblock stylesheet %}
{% block content %}
<div id="main">

    <div id="campaign">
        <div id="each-person-container">
            <!-- from here the redirect will go one to the campaign status -->
            {% for item in allfund %}
            <a href="/html/campaignStatus.html">
                <div class="each-person">
                    <div class="image">
                        <img src="{{item.image.url}}" alt="">
                    </div>
                    <div class="info">
                        <a href="">{{item.title}}</a>
                        <p>{{item.description}}</p>
                    </div>
                    <ul>
                        <li>required :
                            <span>Rs: {{item.required|floatformat:2}}</span>
                        </li>
                        <li>have :
                            <span>Rs: {{item.have|floatformat:2}}</span>
                        </li>
                    </ul>
                </div>
            </a>
            {% endfor %}

        </div>
    </div>

</div>
<div id="footer">

</div>
{% endblock content %}
