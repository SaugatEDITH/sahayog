{% extends "base.html" %}
{% block stylesheet %}
<link rel="stylesheet" href="/static/css/loginSignup.css">
{% endblock stylesheet %}
{% block content %}
<div id="main">



    <form action="/signup/" method="post">
        <center>
            <ul class="messages">
                {% for message in messages %}
                <li{% if message.tags %} class="{{ message.tags }}" {% endif %}>{{ message }}</li>
                    {% endfor %}
            </ul>
        </center> 
            {% csrf_token %}
            <label for="first name">
                First Name : <input type="text" name="first_name" placeholder="First Name">
            </label>

            <label for="last name">
                Last Name : <input type="text" name="last_name" placeholder="Last Name">
            </label>

            <label for="username">
                username : <input type="text" name="username" placeholder="Username">
            </label>

            <label for="last name">
                Email : <input type="text" name="email" placeholder="Email">
            </label>

            <label for="">
                Password:
                <input type="password" name="password" placeholder="password">
            </label>

            <label for="last confirmemail">
                confirm Password : <input type="password" name="confirm_password" placeholder="Confirm Password">
            </label>

            <button type="submit">
                Sign Up
            </button>

    </form>





</div>
<div id="footer">

</div>



{% endblock content %}
